<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0f10"><title>AI head-up dispaly · 额度工具栏</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/api-balances.css"><link rel="stylesheet" href="/toolbar.css"><script src="/theme.js"></script></head>
<body class="ledger"><header><span class="compact-heading">剩余额度</span><button id="desktop-settings" class="settings-button" aria-label="打开设置" title="设置">⚙</button></header>
<main><span id="connection" class="sr-only">正在连接</span><div id="providers" aria-live="polite"><p class="empty">正在读取本地额度…</p></div><section id="api-balances" aria-label="API 账户余额" aria-live="polite"></section></main>
<footer><div class="footer-status"><span id="summary">读取本机保存的额度</span><span id="hint">点击才更新</span></div><p id="message" role="status"></p><div class="bottom-actions"><button id="theme-toggle" class="icon-action" aria-label="切换到亮色" title="切换亮暗">☀</button><button id="refresh" class="icon-action refresh-action" aria-label="后台刷新全部额度" title="后台刷新全部额度"><svg id="refresh-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.34 5.66"/></svg><span id="refresh-text" class="sr-only">全部更新</span></button><button id="browser-pair" class="icon-action" aria-label="复制扩展配对码" title="复制扩展配对码">⇄</button></div></footer><script type="module" src="/toolbar.js"></script></body></html>
